server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Относительные редиректы (Location: /portfolio/ вместо http://домен/portfolio/).
    # Пре-рендер кладёт страницы каталогами (dist/portfolio/index.html), и nginx на
    # /portfolio отвечает 301 со слешем. Абсолютный Location он строит по СВОЕЙ схеме,
    # а этот контейнер стоит за хостовым nginx и видит http — поэтому на живом сайте
    # https://akita-studio.ru/portfolio уводил на http://akita-studio.ru/portfolio/.
    # Хостовой nginx потом поднимал обратно на https, но один хоп уходил открытым.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Хешированные бандлы — кешируем агрессивно
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиа и картинки
    location ~* \.(png|jpg|jpeg|webp|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html — не кешируем (браузер должен перечитывать при новом деплое)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Защита HTML-документа. add_header в location отменяет наследование
        # server-level, поэтому дублируем в обоих блоках, отдающих index.html.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: все маршруты → index.html
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
