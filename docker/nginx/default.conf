server {
    listen 80;
    server_name _;

    client_max_body_size 110m;

    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Раздачи /api/uploads/ здесь больше нет: в БД не осталось ни одной ссылки на
    # этот путь (order_photos.photo_url — все в MinIO), и новые загрузки туда не
    # пишутся. Пользовательские файлы отдавались с origin приложения, а заголовки
    # безопасности до них не доходили — add_header в location гасит родительские.
    # Мёртвый путь проще убрать, чем чинить.

    # Все остальные запросы — в PHP-FPM
    location / {
        fastcgi_pass         php:9000;
        fastcgi_param        SCRIPT_FILENAME /var/www/api/index.php;
        fastcgi_param        REQUEST_URI     $request_uri;
        fastcgi_param        REQUEST_METHOD  $request_method;
        fastcgi_param        CONTENT_TYPE    $content_type;
        fastcgi_param        CONTENT_LENGTH  $content_length;
        fastcgi_param        QUERY_STRING    $query_string;
        # HTTP_X_REAL_IP здесь НЕ выставляем: nginx и так передаёт заголовки запроса
        # в FastCGI как HTTP_*, а $remote_addr в этом контейнере — адрес хостового
        # nginx, а не посетителя. Директива затирала настоящий X-Real-IP от хостового
        # nginx (docs/nginx-host.conf:41), и PHP видел один адрес у всех: троттлинг
        # логина был общим на всех, статистика уников считала бы одного человека.
        include              fastcgi_params;
    }
}
