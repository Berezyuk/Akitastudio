upload_max_filesize = 110M
post_max_size = 115M
memory_limit = 256M
max_execution_time = 120

; Не сообщать версию PHP. По умолчанию каждый ответ несёт заголовок
; X-Powered-By: PHP/8.2.32 — это готовый список CVE под конкретный релиз,
; выданный без единого запроса. На работу не влияет.
expose_php = Off

; Errors
; Базовый php.ini в образе не загружается (php --ini -> Loaded Configuration File: none),
; поэтому действовали дефолты display_errors=On/log_errors=Off: фаталы уходили клиенту
; вместе с путями, SQL и стек-трейсом. Пишем в stderr -> docker compose logs php.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Session security
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
; Idle-timeout: сессия без активности протухает через 2 часа (server-side GC).
session.gc_maxlifetime = 7200
; Раскомментировать после настройки HTTPS (обязательно для продакшена за TLS-прокси):
;session.cookie_secure = 1
