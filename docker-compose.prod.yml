services:
  # ── Точка входа: TLS терминируется здесь ────────────────────────────────────
  nginx:
    # Базовый конфиг (dev, HTTP на 8000) заменяем шаблоном: nginx:alpine сам
    # прогоняет /etc/nginx/templates/*.template через envsubst при старте.
    volumes: !override
      # ./api сюда не монтируем — nginx исходники не читает (см. docker-compose.yml).
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Подхват продлённого сертификата. Именно скриптом энтрипойнта, а не через
      # command: подмена команды отключила бы envsubst и шаблон выше не применился.
      - ./docker/nginx/reload-certs.sh:/docker-entrypoint.d/99-reload-certs.sh:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      # Домены подставляются в шаблон и в пути к сертификатам.
      DOMAIN: ${DOMAIN:?укажи DOMAIN в .env — без него nginx не найдёт сертификат}
      # Поддомен для медиа из MinIO. Нужен отдельный, а не префикс на основном:
      # подпись SigV4 привязана к хосту и пути (подробности в prod.conf.template).
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?укажи MEDIA_DOMAIN в .env — иначе медиа не откроется}
      # envsubst иначе съел бы и $host/$uri самого nginx. Фильтр — это регэксп по
      # ИМЕНАМ переменных, поэтому «DOMAIN» покрывает и DOMAIN, и MEDIA_DOMAIN.
      NGINX_ENVSUBST_FILTER: DOMAIN
    depends_on:
      - php
      - frontend
      - minio

  # ── Статика SPA: наружу не торчит, ходит только через nginx ─────────────────
  frontend:
    image: nginx:1.27-alpine
    container_name: akita_frontend
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]

    # Базовый frontend — dev-сервер Vite: у него env_file: .env и весь репозиторий
    # смонтирован в /app. Compose списки СЛИВАЕТ, а не заменяет, поэтому без явного
    # сброса публичный статик-контейнер получал бы секреты (DB/ADMIN/DADATA/MINIO)
    # и исходники (.env, api/, .git). Для раздачи dist не нужно ни то, ни другое.
    env_file: !reset []
    environment: !reset {}
    volumes: !override
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    # Порт наружу не публикуем: раньше статика висела на 3001 в обход TLS.
    ports: !override []
    depends_on: !reset []

  # ── Продление сертификата ───────────────────────────────────────────────────
  # Первый сертификат выдаёт `make tls-init` (certbot --standalone, до старта
  # nginx). Здесь — только renew: LE отдаёт серты на 90 дней, обновлять начинает
  # за 30. Проверка каждые 12ч; если продлевать нечего, certbot просто выходит.
  certbot:
    image: certbot/certbot
    container_name: akita_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done'

volumes:
  certbot_certs:
  certbot_www:
