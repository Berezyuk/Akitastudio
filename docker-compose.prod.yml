# Прод-оверлей. TLS здесь НЕ терминируется.
#
# Схема на сервере: хостовой nginx (вне докера) держит 80/443 и сертификаты
# Let's Encrypt, а этот стек живёт за ним:
#     хостовой nginx ──┬─ /api/ ──────────► 127.0.0.1:8000  (nginx-контейнер → php)
#                      ├─ /       ────────► 127.0.0.1:3001  (статика dist)
#                      └─ media.<домен> ──► 127.0.0.1:9000  (MinIO, см. docs/nginx-host.conf)
#
# Поэтому compose не должен занимать 80/443 и не должен выпускать сертификаты —
# этим уже занят хостовой nginx с certbot.
services:
  # API наружу не публикуем: с ним говорит только хостовой nginx через петлю.
  # Базовый "8000:80" слушает все интерфейсы, и на сервере это открывало
  # http://<ip>:8000/api/ по голому HTTP — мимо TLS и мимо хостового nginx.
  # postgres и minio в базовом compose уже закрыты на 127.0.0.1, здесь то же самое.
  nginx:
    ports: !override
      - "127.0.0.1:8000:80"

  frontend:
    image: nginx:1.27-alpine
    container_name: akita_frontend
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]

    # Базовый frontend — dev-сервер Vite: у него env_file: .env и весь репозиторий
    # смонтирован в /app. Compose списки СЛИВАЕТ, а не заменяет, поэтому без явного
    # сброса публичный статик-контейнер получал бы секреты (DB/ADMIN/DADATA/MINIO)
    # и исходники (.env, api/, .git). Для раздачи dist не нужно ни то, ни другое.
    env_file: !reset []
    environment: !reset {}
    volumes: !override
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    # Тоже только петля: статику снаружи отдаёт хостовой nginx по HTTPS.
    # Базовый "5173:5173" (dev-сервер Vite) этим !override заодно снимается.
    ports: !override
      - "127.0.0.1:3001:80"
