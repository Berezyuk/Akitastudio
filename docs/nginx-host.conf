# Эталон конфига ХОСТОВОГО nginx (вне докера). Не подключается автоматически —
# это копия того, что лежит на сервере в /etc/nginx/sites-available/akita.
# Держим в репозитории, чтобы схема не жила только в голове у одного человека.
#
# Хостовой nginx терминирует TLS и раскидывает запросы по контейнерам:
#     /api/          -> 127.0.0.1:8000   nginx-контейнер -> php-fpm
#     /              -> 127.0.0.1:3001   статика dist
#     media.<домен>  -> 127.0.0.1:9000   MinIO
#
# Сертификаты выпускает certbot на хосте:
#   certbot --nginx -d akita-studio.ru -d www.akita-studio.ru -d media.akita-studio.ru
# Первый прогон — обязательно с --dry-run: у Let's Encrypt жёсткие лимиты.

server {
    listen 80;
    server_name akita-studio.ru www.akita-studio.ru media.akita-studio.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.akita-studio.ru;
    ssl_certificate     /etc/letsencrypt/live/akita-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akita-studio.ru/privkey.pem;
    return 301 https://akita-studio.ru$request_uri;
}

# ── Основной домен: приложение ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name akita-studio.ru;

    ssl_certificate     /etc/letsencrypt/live/akita-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akita-studio.ru/privkey.pem;

    client_max_body_size 110m;

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # PHP должен знать, что снаружи TLS: иначе session.cookie_secure выставит
        # Secure-куку, которую сам же и не увидит.
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Блока `location /minio/` здесь БОЛЬШЕ НЕТ — см. ниже, почему.
}

# ── Медиа из MinIO: отдельный поддомен ───────────────────────────────────────
# Почему поддомен, а не префикс /minio/ на основном домене.
#
# Раньше было так:
#     location /minio/ { proxy_pass http://127.0.0.1:9000/; }   # слеш срезает префикс
#
# Подпись SigV4 считается по хосту И ПО ПУТИ. SDK подписывал ссылку на
# https://akita-studio.ru/minio, то есть по пути /minio/order-photos/<key>, а
# nginx срезал префикс, и MinIO получал /order-photos/<key> — другой путь,
# подпись не сходится:
#
#     публичный бакет   /minio/portfolio/...    -> 200   (подписи нет, работало)
#     приватный бакет   /minio/order-photos/... -> 403 SignatureDoesNotMatch
#
# Портфолио жило только потому, что бакет публичный. Фото заказов лежат в
# приватном order-photos и отдаются подписанной ссылкой — они бы не открылись
# при первой же загрузке. Проверено на копии этого конфига.
#
# Поддомен решает: путь не переписывается, подпись сходится.
server {
    listen 443 ssl;
    server_name media.akita-studio.ru;

    ssl_certificate     /etc/letsencrypt/live/akita-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akita-studio.ru/privkey.pem;

    client_max_body_size 120m;

    # Здесь лежит пользовательский контент. Свой домен уже изолирует его от
    # origin приложения, но браузер всё равно не должен додумывать тип за нас.
    add_header X-Content-Type-Options "nosniff" always;

    # Витрина портфолио: публичный бакет, ссылки не подписаны — кешировать можно.
    # 30 дней, как уже выбрано для медиа во frontend.conf: год + immutable не
    # прощает перекодировку на месте (жирный файл залипнет у клиента на год).
    #
    # ТОЛЬКО /portfolio/. Этот же домен отдаёт /order-photos/ — приватные фото
    # чужих машин по подписанным ссылкам. Cache-Control: public на них означает,
    # что их сможет держать любой общий прокси.
    location /portfolio/ {
        proxy_pass         http://127.0.0.1:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        # Как и в соседнем location: видео отдаётся кусками по Range. До появления
        # этого блока /portfolio/ обслуживался там и директиву наследовал, теперь —
        # нет. Без неё nginx ходит в MinIO по HTTP/1.0, а это Connection: close на
        # каждый запрос: соединение переустанавливается под каждое видео.
        proxy_http_version 1.1;

        expires 30d;
        add_header Cache-Control "public";
        # add_header в location гасит родительские — nosniff проставляем заново,
        # иначе он пропадёт ровно с пользовательского контента.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # БЕЗ слеша на конце: путь обязан дойти до MinIO неизменным, иначе
        # подпись перестанет сходиться.
        proxy_pass         http://127.0.0.1:9000;

        # Host тоже обязан дойти неизменным — он входит в подпись.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;

        # Видео из портфолио отдаётся кусками по Range. Буферизация ломает
        # перемотку и заставляет nginx тянуть файл целиком в память.
        proxy_buffering    off;
        proxy_http_version 1.1;
    }
}
